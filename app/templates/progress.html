<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress | CogniShield</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.4; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 12px 0; }
    button { padding: 10px 12px; font-size: 15px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #eee; padding: 10px 8px; text-align: left; }
    .muted { color: #555; }
  </style>
</head>
<body>
  <h1>Progress</h1>
  <p class="muted">Stats locales (LocalStorage). Rien n’est envoyé à un serveur.</p>

  <div class="card">
    <button id="exportJsonBtn" type="button">Export JSON</button>
    <button id="exportCsvBtn" type="button">Export CSV</button>
    <button id="clearBtn" type="button">Clear history</button>
  </div>

  <div class="card">
    <h2>Summary</h2>
    <div id="summary"></div>
  </div>

  <div class="card">
    <h2>By Bias Tag</h2>
    <div id="byBias"></div>
  </div>

  <div class="card">
    <h2>By Manipulation Type</h2>
    <div id="byManipulation"></div>
  </div>

  <div class="card">
    <h2>Top Weak Spots</h2>
    <div id="weakspots"></div>
  </div>

  <div class="card">
    <h2>Recent Attempts</h2>
    <div id="recent"></div>
  </div>

  <div class="card">
    <h2>Investigation Summary</h2>
    <div id="investigationSummary"></div>
  </div>

  <div class="card">
    <h2>Investigation by Manipulation Type</h2>
    <div id="investigationByManip"></div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "cognishield_attempts_v1";

      function loadAttempts() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }

      function avg(nums) {
        if (!nums.length) return 0;
        return nums.reduce((a, b) => a + b, 0) / nums.length;
      }

      const attempts = loadAttempts();

      const investigations = attempts.filter(a => a.event_type === "investigation");
      const invTotal = investigations.length;
      const invAvgPrecision = Math.round(avg(investigations.map(a => Number(a.precision || 0))) * 100);
      const invAvgRecall = Math.round(avg(investigations.map(a => Number(a.recall || 0))) * 100);

      document.getElementById("investigationSummary").innerHTML = invTotal
        ? `<p><strong>Total investigations:</strong> ${invTotal}</p>
           <p><strong>Avg precision:</strong> ${invAvgPrecision}%</p>
           <p><strong>Avg recall:</strong> ${invAvgRecall}%</p>`
        : "<p class='muted'>No investigation events yet. Use the investigation mode in a scenario.</p>";

      // Group investigations by manipulation_type
      const invByManip = new Map();
      for (const a of investigations) {
        const key = a.manipulation_type || "UNKNOWN";
        if (!invByManip.has(key)) invByManip.set(key, { n: 0, precisions: [], recalls: [] });
        const s = invByManip.get(key);
        s.n += 1;
        s.precisions.push(Number(a.precision || 0));
        s.recalls.push(Number(a.recall || 0));
      }

      if (invByManip.size === 0) {
        document.getElementById("investigationByManip").innerHTML = "<p class='muted'>No data yet.</p>";
      } else {
        const rows = Array.from(invByManip.entries()).map(([k, s]) => {
          const p = Math.round(avg(s.precisions) * 100);
          const r = Math.round(avg(s.recalls) * 100);
          return `<tr><td>${escapeHtml(k)}</td><td>${s.n}</td><td>${p}%</td><td>${r}%</td></tr>`;
        }).join("");

        document.getElementById("investigationByManip").innerHTML = `
          <table>
            <thead><tr><th>Type</th><th>Events</th><th>Avg precision</th><th>Avg recall</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }
      
      const avgRisk = Math.round(avg(attempts.map(a => Number(a.risk_points || 0))));
      const riskScore = Math.max(0, 100 - avgRisk); // 100 = best, 0 = worst


      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      const total = attempts.length;
      const correct = attempts.filter(a => a.is_correct).length;
      const accuracy = total ? Math.round((correct / total) * 100) : 0;
      const avgTimeMs = Math.round(avg(attempts.map(a => a.decision_time_ms)));

        document.getElementById("summary").innerHTML = `
        <p><strong>Total attempts:</strong> ${total}</p>
        <p><strong>Accuracy:</strong> ${accuracy}%</p>
        <p><strong>Average decision time:</strong> ${avgTimeMs} ms</p>
        <p><strong>Risk Score (0–100):</strong> ${riskScore}</p>
        <p class="muted">Risk Score = 100 - average risk points. Higher is better.</p>
      `;

      // Group by bias tag
      const biasStats = new Map();
      for (const a of attempts) {
        const tags = Array.isArray(a.bias_tags) ? a.bias_tags : [];
        for (const t of tags) {
          if (!biasStats.has(t)) biasStats.set(t, { total: 0, correct: 0, times: [] });
          const s = biasStats.get(t);
          s.total += 1;
          if (a.is_correct) s.correct += 1;
          if (typeof a.decision_time_ms === "number") s.times.push(a.decision_time_ms);
        }
      }

      if (biasStats.size === 0) {
        document.getElementById("byBias").innerHTML = "<p class='muted'>No data yet.</p>";
      } else {
        const rows = Array.from(biasStats.entries()).map(([tag, s]) => {
          const acc = s.total ? Math.round((s.correct / s.total) * 100) : 0;
          const t = Math.round(avg(s.times));
          return `<tr><td>${escapeHtml(tag)}</td><td>${s.total}</td><td>${acc}%</td><td>${t} ms</td></tr>`;
        }).join("");

              // Group by manipulation_type
      const manipStats = new Map();
      for (const a of attempts) {
        const key = a.manipulation_type || "UNKNOWN";
        if (!manipStats.has(key)) manipStats.set(key, { total: 0, correct: 0, risks: [] });
        const s = manipStats.get(key);
        s.total += 1;
        if (a.is_correct) s.correct += 1;
        s.risks.push(Number(a.risk_points || 0));
      }

      if (manipStats.size === 0) {
        document.getElementById("byManipulation").innerHTML = "<p class='muted'>No data yet.</p>";
      } else {
        const rows = Array.from(manipStats.entries()).map(([k, s]) => {
          const acc = s.total ? Math.round((s.correct / s.total) * 100) : 0;
          const avgRisk = Math.round(avg(s.risks));
          const score = Math.max(0, 100 - avgRisk);
          return `<tr><td>${escapeHtml(k)}</td><td>${s.total}</td><td>${acc}%</td><td>${score}</td></tr>`;
        }).join("");

        document.getElementById("byManipulation").innerHTML = `
          <table>
            <thead><tr><th>Type</th><th>Attempts</th><th>Accuracy</th><th>Risk Score</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

        // Weak spots = bias tags with lowest accuracy (min 2 attempts)
        const weak = Array.from(biasStats.entries())
            .map(([tag, s]) => {
            const acc = s.total ? (s.correct / s.total) : 0;
            return { tag, total: s.total, accuracy: acc };
            })
            .filter(x => x.total >= 2)
            .sort((a, b) => a.accuracy - b.accuracy)
            .slice(0, 3);

        if (!weak.length) {
            document.getElementById("weakspots").innerHTML =
            "<p class='muted'>Play more scenarios to unlock a reliable diagnosis (need ≥ 2 attempts per bias).</p>";
        } else {
            const items = weak.map(w =>
            `<li><strong>${escapeHtml(w.tag)}</strong> — Accuracy: ${Math.round(w.accuracy * 100)}% (${w.total} attempts)</li>`
            ).join("");
            document.getElementById("weakspots").innerHTML = `<ul>${items}</ul>`;
        }

        document.getElementById("byBias").innerHTML = `
          <table>
            <thead><tr><th>Bias</th><th>Attempts</th><th>Accuracy</th><th>Avg time</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      // Recent attempts (last 10)
      const recent = attempts.slice(-10).reverse();
      if (!recent.length) {
        document.getElementById("recent").innerHTML = "<p class='muted'>No attempts yet. Play a scenario first.</p>";
      } else {
        const rows = recent.map(a => {
          const ok = a.is_correct ? "✅" : "❌";
          return `<tr>
            <td>${escapeHtml(a.timestamp_iso || "")}</td>
            <td>${escapeHtml(a.scenario_id || "")}</td>
            <td>${escapeHtml(a.selected_choice || "")}</td>
            <td>${ok}</td>
            <td>${escapeHtml(a.decision_time_ms || "")}</td>
          </tr>`;
        }).join("");

        document.getElementById("recent").innerHTML = `
          <table>
            <thead><tr><th>Time</th><th>Scenario</th><th>Choice</th><th>Result</th><th>Time (ms)</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function downloadFile(filename, content, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function toCsv(rows) {
        const headers = [
          "timestamp_iso","scenario_id","channel","difficulty",
          "selected_choice","correct_choice","is_correct",
          "decision_time_ms","risk_points","bias_tags","attack_tags"
        ];

        const escapeCsv = (v) => {
          const s = String(v ?? "");
          const needsQuotes = s.includes(",") || s.includes("\n") || s.includes('"');
          const out = s.replaceAll('"', '""');
          return needsQuotes ? `"${out}"` : out;
        };

        const lines = [];
        lines.push(headers.join(","));
        for (const r of rows) {
          const line = headers.map(h => {
            if (h === "bias_tags" || h === "attack_tags") return escapeCsv(JSON.stringify(r[h] || []));
            return escapeCsv(r[h]);
          }).join(",");
          lines.push(line);
        }
        return lines.join("\n");
      }

      document.getElementById("exportJsonBtn").addEventListener("click", function () {
        const data = JSON.stringify(attempts, null, 2);
        downloadFile("cognishield_attempts.json", data, "application/json");
      });

      document.getElementById("exportCsvBtn").addEventListener("click", function () {
        const csv = toCsv(attempts);
        downloadFile("cognishield_attempts.csv", csv, "text/csv");
      });

      document.getElementById("clearBtn").addEventListener("click", function () {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      });
    })();
  </script>
</body>
</html>
